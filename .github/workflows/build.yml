name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  XRAY_VERSION: v26.11.9
  HEV_VERSION: "2.9.3"
  ICS_VERSION: v0.7.69

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch Xray-core source (for Go version)
        run: git clone --depth 1 --branch "$XRAY_VERSION" https://github.com/XTLS/Xray-core native-build/xray

      - uses: actions/setup-go@v5
        with:
          go-version-file: native-build/xray/go.mod
          cache-dependency-path: native-build/xray/go.sum

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs
          key: native-${{ env.XRAY_VERSION }}-${{ env.HEV_VERSION }}-${{ env.ICS_VERSION }}-${{ hashFiles('scripts/build-native.sh') }}

      - name: Build Xray-core and hev-socks5-tunnel
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          # Pin NDK r27c (LTS); NDK 30 breaks lwIP's errno include in hev-socks5-tunnel.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-native.sh

      - name: Save native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -PxrayVersion=$XRAY_VERSION -PhevVersion=$HEV_VERSION -PicsVersion=$ICS_VERSION

      - name: End-to-end test of generated Xray configs (real Xray-core, real upstream servers)
        run: ./scripts/e2e-xray.sh

      - name: Assemble debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease -PxrayVersion=$XRAY_VERSION -PhevVersion=$HEV_VERSION -PicsVersion=$ICS_VERSION

      - name: Verify APK contents
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-universal-release.apk
          unzip -l "$APK" | grep -E "lib/.*/(libxray|libhev-socks5-tunnel|libopenvpn|libovpnexec)\.so"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "$APK" | head -5
          $BT/aapt2 dump badging "$APK" | head -3
          $BT/aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -i "extractNativeLibs"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/apk/debug/*.apk dist/
          cp e2e-report.txt dist/ || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyFlow-APKs
          path: |
            dist/*.apk
            dist/e2e-report.txt

  android-e2e:
    name: On-device test (Android emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ProxyFlow-APKs
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start upstream HTTP / SOCKS5 / VLESS / OpenVPN servers
        run: ./scripts/e2e-android-servers.sh
      - name: Run app on emulator through real servers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./scripts/e2e-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android-report
          path: e2e-android-report.txt

  release:
    needs: [build, android-e2e]
    if: always() && needs.build.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ProxyFlow-APKs
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-android-report
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          E2E: ${{ needs.android-e2e.result }}
        run: |
          TAG="build-${{ github.run_number }}"
          ls -la dist
          gh release create "$TAG" dist/*.apk dist/*.txt --title "ProxyFlow 1.1.0 (build ${{ github.run_number }})" \
            --notes "Automated build from ${{ github.sha }}. On-device emulator test: $E2E. Install app-arm64-v8a-release.apk on most modern phones, or app-universal-release.apk if unsure." \
            --target "${{ github.sha }}"

permissions:
  contents: write
